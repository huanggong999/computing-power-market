server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://124.174.46.113:3306/ai_cloud_test?useUnicode=true&characterEncoding=utf8
    username: root
    password: ${DEV_DB_PASSWORD:}
    driverClassName: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: ${spring.application.name}-jdbc
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
  data:
    redis:
      host: 124.174.46.113
      port: 6379
      password: ${DEV_REDIS_PASSWORD:}
      timeout: 3000ms
      database: 0
      lettuce:
        pool:
          max-active: 20  # 最大连接数，负值表示没有限制，默认8
          max-wait: -1    # 最大阻塞等待时间，负值表示没限制，默认-1
          max-idle: 8     # 最大空闲连接，默认8
          min-idle: 0     # 最小空闲连接，默认0

security:
  enabled: true
  log-enable: true
  login-url: /login
  repeated-login: true
  request-source-head-key: source
  token-expire-time: 2592000
  ignores:
    - /favicon.ico
    - /springdoc/**
    - /pc/customer/register
    - /pc/ecs/**
    - /apiCallback/**
    - /pc/coupon/page
    - /pc/apply/**
    - /pc/model/**
    - /pc/data/**
    - /pc/apply-type/getAll
    - /pc/carousel/list
    - /pc/apply-type/getAll
    - /onlinePayCallback/**
    - /pc/active/getUserById/**
    - /pc/active/details/list
    - /pc/active/details/**
    - /pc/extend/config-detail
    - /applets/login/getUnionId
    - /applets/login/test/bindOpenId
    - /pc/customer/getEidResult/**
    - /pc/gpu/market/**
  captcha:
    api-url: /code
    enabled: true
    expire-time: 300
    check-urls:
      - /login
      - /pc/customer/updatePassword
      - /pc/customer/register
      - /pc/customer/updateCustomerPhone
      - /applets/login/bindPhone
#    ignores-heads:
#        source:
#        - SMS_LOGIN
  cors:
    allowed-methods:
      - '*'
    allowed-origins:
      - '*'

# ===== SpringDoc配置 =====#
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    # enabled the /v3/api-docs endpoint
    enabled: true

# ===== log4j2配置 =====#
logging:
  level:
    com.lingyang.system: debug

vol-engine:
  access-key: ${VOLC_ACCESS_KEY:}
  access-secret: ${VOLC_ACCESS_SECRET:}
  regions: cn-beijing
  project-name: ai_cloud_system
  tos:
    endpoint: tos-cn-beijing.volces.com
    bucket-name: ai-cloud-system
    region: cn-beijing

cache:
  queue:
    enable: true
    queue-key: ${spring.application.name}-${spring.profiles.active}-cache-queue
    pool:
      core-pool-size: 5
      max-pool-size: 15
      queue-capacity: 30
      keep-alive-seconds: 300

# 支付宝支付
alipay:
  server_url: https://openapi.alipay.com/gateway.do
  app_id: 2021005101676006
  alipay_public_key: ${ALIPAY_PUBLIC_KEY:}
  private_key: ${ALIPAY_PRIVATE_KEY:}
  format: json
  charset: utf-8
  sign_type: RSA2
  notify_url: https://eyunai.net/api/onlinePayCallback/ali_pay_notify
  return_url: https://eyunai.net/api/onlinePayCallback/ali_pay_return
  success_web_url: https://eyunai.net/#/accountCenter

applet:
  weixin:
    appId: 'wx4a9bd7a194d518e5'
    appKey: ${WECHAT_APP_KEY:}
    #临时目录
    tempImage: /www/wwwroot/temp/
    # 小程序环境（develop 开发版环境，trial 体验版环境，release 正式版环境）
    envVersion: trial
    reserveOrderNotifyUrl: 'https://eyunai.net/api/apiCallback/onlinePayCallback/pay-wx-notify'

# 腾讯服务配置
